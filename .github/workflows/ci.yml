name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: winget install --id BrechtSanders.WinLibs.POSIX.UCRT -e --accept-source-agreements --accept-package-agreements

      - name: Run unit tests
        run: cpp/test.cmd

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libcurl4-openssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libgeoclue-2-dev libsystemd-dev

      - name: Build and test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --target duskplug_tests
          cpp/build/duskplug_tests

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --target duskplug_tests
          cpp/build/duskplug_tests

  release:
    needs: [test-windows, test-linux, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        run: winget install --id BrechtSanders.WinLibs.POSIX.UCRT -e --accept-source-agreements --accept-package-agreements

      - name: Build DuskPlug
        run: cpp/build.cmd

      - name: Build MSI
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-msi.ps1

      - name: Detect SignPath configuration
        id: signpath_config
        shell: pwsh
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace('${{ secrets.SIGNPATH_API_TOKEN }}')
          Write-Host "SignPath signing enabled: $enabled"
          "enabled=$enabled" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned binaries for SignPath
        if: steps.signpath_config.outputs.enabled == 'true'
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: duskplug-unsigned
          path: |
            DuskPlug.exe
            DuskPlug.msi
          retention-days: 1

      - name: Submit signing request to SignPath
        if: steps.signpath_config.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Apply signed binaries
        if: steps.signpath_config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item -Force signed/DuskPlug.exe DuskPlug.exe
          Copy-Item -Force signed/DuskPlug.msi DuskPlug.msi

      - name: Package release ZIP
        shell: pwsh
        run: |
          $staging = New-Item -ItemType Directory -Path release-staging -Force
          Copy-Item DuskPlug.exe, config.example.json, README.md, Setup.ps1, Setup.cmd, Start-DuskPlug.cmd, Install-Startup.ps1, Install-Startup.cmd, Uninstall-Startup.ps1, Uninstall-Startup.cmd, Build-DuskPlug.cmd -Destination $staging
          Copy-Item -Recurse assets, lib, docs -Destination $staging
          Compress-Archive -Path "$staging\*" -DestinationPath DuskPlug-Windows.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DuskPlug-Windows.zip
            DuskPlug.msi

      - name: Upload Windows artifacts for manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            DuskPlug-Windows.zip
            DuskPlug.msi
          retention-days: 1

  release-linux:
    needs: [test-windows, test-linux, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux tarball
        run: bash scripts/build-linux.sh
      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          files: DuskPlug-Linux-x64.tar.gz

      - name: Upload Linux artifact for manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: DuskPlug-Linux-x64.tar.gz
          retention-days: 1

  release-macos:
    needs: [test-windows, test-linux, test-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS zip
        run: bash scripts/build-macos.sh
      - name: Upload macOS release asset
        uses: softprops/action-gh-release@v2
        with:
          files: DuskPlug-macOS.zip

      - name: Upload macOS artifact for manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: DuskPlug-macOS.zip
          retention-days: 1

  release-manifest:
    needs: [release, release-linux, release-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $notesUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          & scripts/generate-latest-json.ps1 `
            -Version $version `
            -NotesUrl $notesUrl `
            -OutFile latest.json `
            -WindowsMsi release-artifacts/release-windows/DuskPlug.msi `
            -WindowsZip release-artifacts/release-windows/DuskPlug-Windows.zip `
            -LinuxTarball release-artifacts/release-linux/DuskPlug-Linux-x64.tar.gz `
            -MacosZip release-artifacts/release-macos/DuskPlug-macOS.zip

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
