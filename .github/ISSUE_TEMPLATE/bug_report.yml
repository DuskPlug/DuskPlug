name: Bug report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - MSI installer
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DuskPlug version
      description: Release tag or commit if built from source
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install DuskPlug.msi
        2. Enable Smart Mode
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Windows version, Tuya data center, etc. Do not paste Access Secret or Device ID.
