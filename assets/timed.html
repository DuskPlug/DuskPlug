<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DuskPlug Timed Mode</title>
  <style>
    :root {
      --bg0: #0c1018; --bg1: #141a24; --card: rgba(24, 31, 44, 0.92);
      --card-border: rgba(255, 255, 255, 0.07); --text: #eef3f8; --muted: #93a0b4;
      --accent: #e7a35a; --accent-2: #8bb7ff; --accent-dim: rgba(231, 163, 90, 0.16);
      --danger: #ff7b83; --input: #0f1520; --input-border: rgba(255, 255, 255, 0.1);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35); --radius: 14px;
      --font: "Segoe UI", "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--font); color: var(--text);
      background: radial-gradient(900px 320px at 10% -10%, rgba(231, 163, 90, 0.18), transparent 55%),
        radial-gradient(700px 420px at 110% 0%, rgba(139, 183, 255, 0.12), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      display: flex; flex-direction: column;
    }
    header { display: flex; align-items: center; gap: 14px; padding: 18px 24px 10px; }
    .mark { width: 38px; height: 38px; border-radius: 11px; display: block; flex-shrink: 0; object-fit: contain; }
    .brand h1 { margin: 0; font-size: 17px; font-weight: 650; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    main { flex: 1; overflow: auto; padding: 6px 24px 16px; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .card h2 { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
    .hint { margin: 0 0 14px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    input { height: 36px; border-radius: 10px; border: 1px solid var(--input-border); background: var(--input); color: var(--text); padding: 0 11px; font: inherit; font-size: 13.5px; }
    input:focus { border-color: rgba(231, 163, 90, 0.7); box-shadow: 0 0 0 3px var(--accent-dim); outline: none; }
    .duration-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .duration-row output { min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 13px; font-weight: 650; }
    .error { margin-top: 10px; color: var(--danger); font-size: 12.5px; min-height: 18px; }
    footer { display: flex; align-items: center; gap: 12px; padding: 12px 24px 16px; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(8, 11, 16, 0.72); }
    .toast { flex: 1; min-height: 20px; font-size: 12.5px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    button.btn { height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: var(--text); font: inherit; font-size: 13px; font-weight: 650; padding: 0 14px; cursor: pointer; }
    button.btn:hover { background: rgba(255,255,255,0.09); }
    button.btn.primary { background: linear-gradient(180deg, #f0b36e, #d4893a); border-color: transparent; color: #1b1208; min-width: 132px; }
    button.btn.ghost { background: transparent; }
  </style>
</head>
<body>
  <header>
    <img class="mark" src="/*__DUSKPLUG_MARK__*/" alt="" aria-hidden="true">
    <div class="brand">
      <h1>Timed mode</h1>
      <p>Turn devices on now, then off automatically.</p>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Duration</h2>
      <p class="hint">Choose how long devices stay on before DuskPlug turns them off.</p>
      <label>Minutes
        <div class="duration-row">
          <input id="minutes" type="number" min="1" max="10080" step="1" inputmode="numeric">
          <output id="minutesOut">30 min</output>
        </div>
      </label>
      <p class="hint">1 to 10080 minutes (7 days).</p>
      <div class="error" id="error" aria-live="polite"></div>
    </section>
  </main>

  <footer>
    <div class="toast" id="toast"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="button" class="btn primary" id="ok">Start timed mode</button>
    </div>
  </footer>

  <script>
    const BOOT = /*__DUSKPLUG_BOOT__*/null;

    function $(id) { return document.getElementById(id); }
    function postNative(msg) {
      const payload = JSON.stringify(msg);
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(payload);
    }

    let minMinutes = 1;
    let maxMinutes = 10080;

    function formatDuration(minutes) {
      if (minutes === 1) return "1 min";
      if (minutes < 60) return minutes + " min";
      if (minutes % 60 === 0) {
        const hours = minutes / 60;
        return hours === 1 ? "1 hour" : hours + " hours";
      }
      return minutes + " min";
    }

    function refreshOutput() {
      const value = Number($("minutes").value);
      $("minutesOut").textContent = Number.isFinite(value) ? formatDuration(value) : "—";
    }

    function showError(message) {
      $("error").textContent = message || "";
    }

    function submit() {
      const minutes = Number($("minutes").value);
      if (!Number.isFinite(minutes) || minutes < minMinutes) {
        showError("Enter a duration of at least " + minMinutes + " minute.");
        $("minutes").focus();
        return;
      }
      if (minutes > maxMinutes) {
        showError("Enter a duration of " + maxMinutes + " minutes or less.");
        $("minutes").focus();
        return;
      }
      showError("");
      postNative({ type: "ok", minutes: Math.round(minutes) });
    }

    $("minutes").addEventListener("input", () => { showError(""); refreshOutput(); });
    $("ok").onclick = submit;
    $("cancel").onclick = () => postNative({ type: "cancel" });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") postNative({ type: "cancel" });
      if (e.key === "Enter") submit();
    });

    if (BOOT) {
      minMinutes = Number(BOOT.minMinutes || 1);
      maxMinutes = Number(BOOT.maxMinutes || 10080);
      $("minutes").min = String(minMinutes);
      $("minutes").max = String(maxMinutes);
      $("minutes").value = String(Number(BOOT.minutes || 30));
      refreshOutput();
      $("minutes").focus();
      $("minutes").select();
    }
  </script>
</body>
</html>
